<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>词汇卡 · 四级+专升本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a93'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3EW%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#1a1c22; --sub:#6b7280; --bg:#f4f5fa; --card:#ffffff;
  --brand:#1f3a93; --brand2:#4a6bc8; --line:#e6e8f0;
  --ok:#1f8a5b; --ok-bg:#e9f7f0; --no:#c9544a; --no-bg:#fdeeec;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink);
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;padding:0 14px calc(14px + env(safe-area-inset-bottom));}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
.brand{font-size:17px;font-weight:800;color:var(--brand);letter-spacing:.3px;display:flex;align-items:baseline;gap:8px;}
.brand-sub{font-size:12px;font-weight:500;color:var(--sub);}
.stats{font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap;}
.modes{display:flex;gap:6px;margin-bottom:10px;}
.modes button{
  flex:1;border:1px solid var(--line);background:#fff;color:var(--sub);
  font-size:14px;font-weight:600;padding:12px 0;min-height:46px;border-radius:12px;cursor:pointer;
  transition:all .15s ease;font-family:inherit;
}
.modes button.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.progress{height:5px;background:#e2e5ef;border-radius:3px;overflow:hidden;margin-bottom:10px;}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px;transition:width .25s ease;}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.cardwrap{perspective:1200px;cursor:pointer;}
.card{
  position:relative;width:100%;aspect-ratio:3/4.1;max-height:58vh;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.1,.2,1);
  border-radius:var(--radius);box-shadow:0 2px 4px rgba(31,58,147,.06),0 12px 32px rgba(31,58,147,.10);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
}
.front .w{font-size:clamp(30px,9vw,44px);font-weight:800;color:var(--ink);letter-spacing:.5px;word-break:break-word;}
.front .p-label{font-size:13px;color:var(--sub);margin-top:18px;border:1px solid var(--line);border-radius:999px;padding:5px 14px;background:#fafbff;}
.back{transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto;}
.back .row{width:100%;text-align:left;}
.back .pos{color:var(--brand);font-weight:700;font-size:14px;margin-bottom:10px;}
.back .mean{font-size:clamp(18px,5.4vw,24px);font-weight:700;line-height:1.5;margin-bottom:14px;color:var(--ink);}
.back .ipa2{color:var(--sub);font-size:14px;margin-bottom:12px;}
.back .line{font-size:13px;line-height:1.65;margin-bottom:8px;color:#3d4253;}
.back .line b{color:#a03a33;font-weight:700;}
.back .line.y b{color:#1f6f43;}
.back .line.e b{color:var(--brand);font-weight:700;}
.hint{text-align:center;color:var(--sub);font-size:13px;margin-top:12px;}
.actions{display:flex;gap:12px;margin-top:12px;}
.actions button{
  flex:1;border:none;border-radius:14px;padding:15px 0;font-size:16px;font-weight:700;cursor:pointer;
  color:#fff;transition:transform .1s ease,opacity .15s;font-family:inherit;
}
.actions button:active{transform:scale(.97);}
.btn-no{background:var(--no);box-shadow:0 4px 12px rgba(201,84,74,.25);}
.btn-ok{background:var(--ok);box-shadow:0 4px 12px rgba(31,138,91,.25);}
.actions button:disabled{opacity:.4;pointer-events:none;}
/* 搜索模式 */
.searchbox{display:none;}
body.mode-search .searchbox{display:block;margin-bottom:10px;}
body.mode-search .stage{justify-content:flex-start;}
body.mode-search .cardwrap{display:none;}
body.mode-search .actions{display:none;}
.searchbox input{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;
  background:#fff;font-family:inherit;outline:none;
}
.searchbox input:focus{border-color:var(--brand2);}
#slist{flex:1;overflow-y:auto;margin-top:10px;}
.sitem{
  display:flex;align-items:baseline;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;
}
.sitem .sw{font-weight:700;font-size:15px;color:var(--brand);min-width:88px;}
.sitem .sm{font-size:13px;color:#3d4253;line-height:1.5;}
/* 查看词详情弹层 */
.detail{display:none;position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:50;align-items:flex-end;justify-content:center;}
body.show-detail .detail{display:flex;}
.dsheet{
  width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:72dvh;overflow-y:auto;animation:up .25s ease;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.dsheet .dw{font-size:26px;font-weight:800;color:var(--ink);}
.dsheet .dipa{color:var(--sub);font-size:15px;margin:4px 0 8px;}
.dsheet .dpos{color:var(--brand);font-weight:700;font-size:14px;margin-bottom:6px;}
.dsheet .dmean{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:12px;}
.dsheet .dline{font-size:14px;line-height:1.7;margin-bottom:8px;color:#3d4253;}
.dsheet .dline b{color:#a03a33;}
.dsheet .dline.y b{color:#1f6f43;}
.dsheet .dact{display:flex;gap:10px;margin-top:16px;}
.dsheet .dact button{flex:1;border:none;border-radius:12px;padding:12px 0;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
/* 完成态 */
.done{text-align:center;padding:30px 10px;}
.done .d1{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--brand);}
.done .d2{font-size:13px;color:var(--sub);line-height:1.7;}
/* 重置 */
.reset{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:12px;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(26,28,34,.88);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>

  <nav class="modes" id="modes">

          <div class="row" id="bsyn"><div class="line y"><b>近义</b>　<span id="bsynt"></span></div></div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">点击卡片查看释义</div>
    <div id="slist"></div>
  </main>
  <footer class="actions">
    <button class="btn-no" id="btnNo">不认识</button>
    <button class="btn-ok" id="btnOk">认识</button>
  </footer>
</div>
<button class="reset" id="btnReset">重置进度</button>
<div class="detail" id="detail"><div class="dsheet" id="dsheet"></div></div>
<div class="toast" id="toast"></div>

const KEY = "vocab_card_v1";
const DKEY = "vocab_card_date";
function today(){return new Date().toISOString().slice(0,10);}
let st = {
  seq: 0, rand: [], wrong: {}, wpos: 0, mode: "seq",
  known: {}, seen: {}, todayN: 0, date: today()
};
try{
  const s = localStorage.getItem(KEY);
  if(s){const p = JSON.parse(s); Object.assign(st, p);}
  if(st.date !== today()){ st.date = today(); st.todayN = 0; st.seen = {}; save(); }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function curWord(){
  if(st.mode==="seq"){ return DATA[st.seq] || null; }
  if(st.mode==="rand"){ return st.rand[0] || null; }
  if(st.mode==="wrong"){
    const list = DATA.filter(e => st.wrong[e.w]);
    return list[st.wpos] || null;
  }
  return null;
}
let flipped = false;
function render(){
  const el = curWord();
  const stats = document.getElementById("stats");
  const knownN = Object.keys(st.known).length;
  const wrongN = DATA.filter(e => st.wrong[e.w]).length;
  stats.textContent = "今日 " + st.todayN + " · 掌握 " + knownN + " · 错词 " + wrongN;
  if(!el){
    document.getElementById("cardwrap").style.display = "none";
    document.getElementById("hint").innerHTML = '<div class="done"><div class="d1">这一轮背完了</div><div class="d2">切到「随机」或「错词本」继续，或点「重置进度」重新开始。</div></div>';
    document.getElementById("btnNo").disabled = true;
    document.getElementById("btnOk").disabled = true;
    return;
  }
  document.getElementById("cardwrap").style.display = "";
  document.getElementById("btnNo").disabled = false;
  document.getElementById("btnOk").disabled = false;
  const card = document.getElementById("card");
  if(flipped) card.classList.remove("flipped");
  flipped = false;
  document.getElementById("fword").textContent = el.w;
  document.getElementById("fipa").textContent = "/" + (el.i || "") + "/";
  document.getElementById("bpos").textContent = el.p || "";
  document.getElementById("bmean").textContent = el.m || "";
  document.getElementById("bipa").textContent = "/" + (el.i || "") + "/";
  const sim = document.getElementById("bsim"), syn = document.getElementById("bsyn");
  sim.style.display = el.s ? "" : "none";
  syn.style.display = el.y ? "" : "none";
  document.getElementById("bsimt").textContent = el.s || "";
  document.getElementById("bsynt").textContent = el.y || "";
  // 进度条
  let p = 0;
  if(st.mode==="seq") p = DATA.length ? (st.seq / DATA.length) * 100 : 0;
  else if(st.mode==="wrong"){
    const n = DATA.filter(e => st.wrong[e.w]).length;
    p = n ? (Math.min(st.wpos, n-1) / n) * 100 : 0;
  }
  document.getElementById("bar").style.width = p.toFixed(1) + "%";
}
function nextWord(){
  if(st.mode==="seq"){ st.seq++; save(); render(); return; }
  if(st.mode==="rand"){ st.rand.shift(); save(); render(); return; }
  if(st.mode==="wrong"){
    const n = DATA.filter(e => st.wrong[e.w]).length;
    if(st.wpos < n-1){ st.wpos++; } else { st.wpos = n; }
    save(); render(); return;
  }
}
document.getElementById("cardwrap").addEventListener("click", function(){
  const card = document.getElementById("card");
  card.classList.toggle("flipped");
  flipped = !flipped;
  document.getElementById("hint").textContent = flipped ? "" : "点击卡片查看释义";
});
document.getElementById("btnNo").addEventListener("click", function(){
  const el = curWord(); if(!el) return;
  st.wrong[el.w] = true;
  st.todayN++; st.seen[el.w] = true;
  save(); nextWord();
});
document.getElementById("btnOk").addEventListener("click", function(){
  const el = curWord(); if(!el) return;
  st.known[el.w] = true;
  if(st.wrong[el.w]) delete st.wrong[el.w];
  st.todayN++; st.seen[el.w] = true;
  save(); nextWord();
});
// 模式切换
document.getElementById("modes").addEventListener("click", function(ev){
  const b = ev.target.closest("button"); if(!b) return;
  st.mode = b.dataset.mode;
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("active", x === b));
  document.body.classList.toggle("mode-search", st.mode === "search");
  if(st.mode === "rand" && !st.rand.length) st.rand = shuffle(DATA);
  if(st.mode === "wrong") st.wpos = 0;
  if(st.mode !== "search") document.getElementById("slist").innerHTML = "";
  render();
});
// 搜索
const q = document.getElementById("q");
q.addEventListener("input", function(){
  const t = q.value.trim().toLowerCase();
  const list = document.getElementById("slist");
  if(!t){ list.innerHTML = ""; return; }
  const hit = DATA.filter(e => (e.w.toLowerCase().includes(t)) || (e.m && e.m.includes(q.value.trim()))).slice(0, 60);
  list.innerHTML = hit.map(e => '<div class="sitem" data-w="' + e.w + '"><span class="sw">' + e.w + '</span><span class="sm">' + (e.m||"") + '</span></div>').join("");
});
document.getElementById("slist").addEventListener("click", function(ev){
  const it = ev.target.closest(".sitem"); if(!it) return;
  const w = it.dataset.w;
  const el = DATA.find(e => e.w === w); if(!el) return;
  showDetail(el);
});
function showDetail(el){
  const simH = el.s ? '<div class="dline"><b>形近</b>　' + el.s + '</div>' : "";
  const synH = el.y ? '<div class="dline y"><b>近义</b>　' + el.y + '</div>' : "";
  document.getElementById("dsheet").innerHTML =
    '<div class="dw">' + el.w + '</div>' +
    '<div class="dipa">/' + (el.i||"") + '/　' + (el.p||"") + '</div>' +
    '<div class="dmean">' + (el.m||"") + '</div>' +
    simH + synH +
    '<div class="dact"><button class="btn-no" id="dNo">不认识</button><button class="btn-ok" id="dOk">认识</button></div>';
  document.body.classList.add("show-detail");
  document.getElementById("dNo").onclick = function(){ mark(el, false); closeDetail(); };
  document.getElementById("dOk").onclick = function(){ mark(el, true); closeDetail(); };
}
function mark(el, ok){
  if(ok){ st.known[el.w] = true; if(st.wrong[el.w]) delete st.wrong[el.w]; toast("已标记：认识"); }
  else{ st.wrong[el.w] = true; toast("已加入错词本"); }
  st.todayN++; save();
}
function closeDetail(){ document.body.classList.remove("show-detail"); }
document.getElementById("detail").addEventListener("click", function(ev){
  if(ev.target === document.getElementById("detail")) closeDetail();
});
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 1400);
}
// 重置
document.getElementById("btnReset").addEventListener("click", function(){
  if(!confirm("确定清空全部进度（掌握/错词/今日计数）？")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  st = {seq:0, rand:[], wrong:[], wpos:0, mode:"seq", known:{}, seen:{}, todayN:0, date:today()};
  render(); toast("进度已重置");
});
// 初始
document.body.classList.add("mode-" + (st.mode==="search"?"search":"normal"));
if(st.mode === "rand" && !st.rand.length) st.rand = shuffle(DATA);
render();
</script>
</body>
</html>
